# Nginx — intelligence-hub (news.viajeinteligencia.com)
# Colocar en /etc/nginx/sites-available/intelligence-hub

server {
    listen 80;
    listen [::]:80;
    server_name news.viajeinteligencia.com;

    root /var/www/daily_readings;
    index index.html;

    # Static files
    location / {
        try_files $uri $uri/ =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Counter API (proxy al servicio Python)
    location /api/count {
        proxy_pass http://127.0.0.1:9099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # No loggeo de favicon
    location = /favicon.ico { access_log off; log_not_found off; }
}
